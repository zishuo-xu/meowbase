# 守住类型检查 + 全部单测，避免 build 静默变红
name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      # action-setup 管 pnpm 10 及以下(v11+ 才换 pnpm/setup);必须排在 setup-node 前面,
      # 且 cache 只能显式写:setup-node v5 起默认不再自动缓存 pnpm
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm typecheck:scripts
      - run: pnpm test
      - run: pnpm e2e
      - run: pnpm eval
